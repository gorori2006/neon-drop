<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <radialGradient id="bg" cx="50%" cy="30%" r="80%">
      <stop offset="0" stop-color="#0d1f3a"/>
      <stop offset="1" stop-color="#01030a"/>
    </radialGradient>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="10" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <rect width="512" height="512" fill="url(#bg)"/>
  <g filter="url(#glow)" stroke-width="10" stroke-linejoin="round">
    <g fill="rgba(255,47,208,.28)" stroke="#ff2fd0">
      <rect x="116" y="110" width="88" height="88" rx="14"/>
      <rect x="212" y="110" width="88" height="88" rx="14"/>
      <rect x="308" y="110" width="88" height="88" rx="14"/>
      <rect x="212" y="206" width="88" height="88" rx="14"/>
    </g>
    <g fill="rgba(34,232,255,.22)" stroke="#22e8ff">
      <rect x="116" y="314" width="88" height="88" rx="14"/>
      <rect x="308" y="314" width="88" height="88" rx="14"/>
    </g>
  </g>
</svg>
